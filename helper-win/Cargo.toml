[package]
name = "vibe-seam-helper"
version = "0.2.5"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Windows side of the VibeRDP Seam mode"

[target.'cfg(windows)'.dependencies]
# COM for the startup shortcut: IShellLinkW and IPersistFile, which windows-sys does not carry
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
